[cloud]
; 云端地址：Coolify 部署好之后填，例如 https://你的域名.sslip.io（不要带 /mcp）
base_url =
; 采集口令：换成你自己的，并且要和云端 COLLECTOR_TOKEN 完全一致
collector_token = 换成你自己的采集口令
; 设备名，会显示在云端状态里
device_name = my-pc

[collector]
; 多久读一次播放状态（秒）
poll_seconds = 1
; 多久上传一次状态（秒）
heartbeat_seconds = 15
; 听满多少比例才算“整首听完”，0.95 = 95%
complete_ratio = 0.95
; 两次采集间隔超过这么多秒，视为电脑休眠/采集中断，不把这段时间算成听歌
discontinuity_seconds = 30
; 日志保留天数
log_keep_days = 7

[audio]
; 一起听（录音 + 音频分析）总开关
enabled = true
; 录音缓冲最多保留多少秒（单首，超过从最前面丢）
max_buffer_seconds = 600
; 至少录到多少秒才允许分析
min_seconds = 15
; 多久向云端问一次"有没有要听的歌"（秒）
poll_seconds = 3
; 是否允许深听（关掉就只跑浅听，省资源）
deep_enabled = true
; 分析环境里的 python（默认在 C 盘，安装音频分析.bat 会建好）
; python = C:\Users\你的用户名\AppData\Local\qqmusic-audio\venv\Scripts\python.exe
; 听骨源码目录（默认项目自带 vendor\tinggu，一般不用改）
; tinggu_dir = ..\vendor\tinggu
